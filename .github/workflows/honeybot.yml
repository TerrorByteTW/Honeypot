name: HoneyBot Issue Triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    # New issues always run. Comments (on issues, not PRs, and not from bots) run when they either:
    #   - mention @honeypot-bot (a command; the script checks the commenter is allowed), or
    #   - are from the issue author, on a Bug issue, and contain an mclo.gs link (automatic log reply).
    # The script re-checks all of this as well. String comparisons here are case-insensitive.
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       (contains(github.event.comment.body, '@honeypot-bot') ||
        ((github.event.issue.type.name == 'Bug' || contains(github.event.issue.labels.*.name, 'bug')) &&
         github.event.comment.user.login == github.event.issue.user.login &&
         contains(github.event.comment.body, 'mclo.gs/'))))
    runs-on: ubuntu-latest
    steps:
      # Optional: post as your own GitHub App (e.g. "Honeypot") instead of github-actions.
      # Skipped automatically if the HONEYBOT_APP_ID variable isn't set.
      - name: Generate GitHub App token
        id: app-token
        if: vars.HONEYBOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.HONEYBOT_APP_ID }}
          private-key: ${{ secrets.HONEYBOT_APP_PRIVATE_KEY }}

      - name: Checkout manifest and script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            version_manifest.yml
            .github/scripts
          sparse-checkout-cone-mode: false

      # yq ships preinstalled on GitHub's Ubuntu runners, so no npm install is needed.
      # If the manifest is missing or invalid, the script just skips the support check.
      - name: Convert version manifest to JSON
        run: |
          if [ -f version_manifest.yml ]; then
            yq -o=json '.' version_manifest.yml > "$RUNNER_TEMP/manifest.json" \
              || echo "::warning::Could not parse version_manifest.yml"
          else
            echo "::warning::version_manifest.yml not found"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run HoneyBot
        run: node .github/scripts/honeybot.mjs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          MANIFEST_JSON: ${{ runner.temp }}/manifest.json
